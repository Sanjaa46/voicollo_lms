name: Release

# Version-file driven releases. The VERSION file is the source of truth:
#
#   * push to main  -> if tag v<VERSION> does not exist yet, build + push the
#                      image, then create the tag and the GitHub release.
#                      If it already exists, nothing happens (not a release).
#   * push a v* tag -> release that tag (it must match VERSION).
#   * Actions tab   -> "Run workflow" re-runs the check for the current main.
#
# So releasing = bump VERSION + CHANGELOG in a PR (scripts/release.sh X.Y.Z)
# and merge it. Nobody has to push tags by hand.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs existing tags to decide whether to release

      - name: Decide version
        id: version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION '$version' is not SemVer"; exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)"; exit 1
            fi
            release=true
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already released; nothing to do"
            release=false
          else
            release=true
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
            echo "prerelease=$prerelease"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Image tags
        if: steps.version.outputs.release == 'true'
        id: tags
        run: |
          image="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/voicollo-lms"
          version="${{ steps.version.outputs.version }}"
          tags="$image:$version"
          if [ "${{ steps.version.outputs.prerelease }}" = "false" ]; then
            major_minor="$(echo "$version" | cut -d. -f1,2)"
            tags="$tags,$image:$major_minor,$image:latest"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.release == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.version.outputs.release == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # TOKEN_GITHUB: classic PAT with write:packages. Falls back to the
          # built-in token, which can also push (permissions: packages: write).
          password: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - if: steps.version.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.release == 'true'
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "**Image:** \`${{ steps.tags.outputs.image }}:${{ steps.version.outputs.version }}\`"
            echo
            echo "Deploy: set \`LMS_VERSION=${{ steps.version.outputs.version }}\` in \`deploy/.env\`, then \`docker compose pull && docker compose up -d\`."
          } >> release-notes.md

      # Creates the tag (on this exact commit) if it does not exist yet. Tags made
      # with the built-in token do not re-trigger this workflow.
      - if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Voicollo LMS ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            deploy/docker-compose.yml
            deploy/.env.example
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
