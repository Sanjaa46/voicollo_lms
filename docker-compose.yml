# =============================================================================
# purpose:  Single-node Docker Compose deployment for the LMS system.
#           Five containers:
#             lms-frontend — Nginx serving the built React SPA
#             lms-api      — FastAPI/Uvicorn application
#             lms-db       — MariaDB 10.6 persistent storage
#             lms-cache    — Redis 7 caching layer
#             lms-migrate  — Alembic run-once migration container
#
# Usage (run from ./lms):
#   cp .env.example .env && vi .env   # Fill in passwords and secrets
#   docker compose up -d --build      # Build and start all services
#   docker compose logs -f lms-api    # Follow API logs
# =============================================================================

version: "3.9"

volumes:
  lms_db_data:
    driver: local
  lms_redis_data:
    driver: local

networks:
  lms_internal:
    driver: bridge

services:

  # =========================================================================
  # lms-db — MariaDB 10.6+
  # =========================================================================
  lms-db:
    image: mariadb:10.6
    container_name: lms-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: lms
      MARIADB_USER: ${LMS_APP_DB_USER:-lms_app}
      MARIADB_PASSWORD: ${LMS_APP_DB_PASSWORD:?LMS_APP_DB_PASSWORD is required}
      TZ: Asia/Ulaanbaatar
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
    volumes:
      - lms_db_data:/var/lib/mysql
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =========================================================================
  # lms-cache — Redis 7+
  # =========================================================================
  lms-cache:
    image: redis:7-alpine
    container_name: lms-cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 3600 1
      --save 300 100
      --save 60 10000
      --loglevel notice
    environment:
      TZ: Asia/Ulaanbaatar
    volumes:
      - lms_redis_data:/data
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # =========================================================================
  # lms-migrate — Alembic one-shot migration runner
  # =========================================================================
  lms-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      ROOT_DATABASE_URL: mysql+aiomysql://root:${DB_ROOT_PASSWORD}@lms-db:3306/lms
      LMS_APP_DB_PASSWORD: ${LMS_APP_DB_PASSWORD}
      LMS_RETENTION_DB_PASSWORD: ${LMS_RETENTION_DB_PASSWORD:?LMS_RETENTION_DB_PASSWORD is required}
      TZ: Asia/Ulaanbaatar
    depends_on:
      lms-db:
        condition: service_healthy
    networks:
      - lms_internal
    restart: "no"

  # =========================================================================
  # lms-api — FastAPI/Uvicorn application
  # =========================================================================
  lms-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    container_name: lms-api
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
      --access-log
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}

      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:?GITHUB_REDIRECT_URI is required}

      DATABASE_URL: mysql+aiomysql://${LMS_APP_DB_USER:-lms_app}:${LMS_APP_DB_PASSWORD}@lms-db:3306/lms
      DB_HOST: lms-db
      RETENTION_DATABASE_URL: mysql+aiomysql://lms_retention:${LMS_RETENTION_DB_PASSWORD}@lms-db:3306/lms
      ALLOWED_GITHUB_USERNAME: ${ALLOWED_GITHUB_USERNAME:?ALLOWED_GITHUB_USERNAME is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}

      REDIS_URL: redis://:${REDIS_PASSWORD}@lms-cache:6379/0

      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-60}
      HEALTH_CACHE_TTL_SECONDS: ${HEALTH_CACHE_TTL_SECONDS:-10}

      INGEST_SIGNING_SECRET: ${INGEST_SIGNING_SECRET:?INGEST_SIGNING_SECRET is required}

      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}

      APP_LOG_RETENTION_DAYS: ${APP_LOG_RETENTION_DAYS:-90}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
      RETENTION_JOB_HOUR: ${RETENTION_JOB_HOUR:-2}
      RETENTION_JOB_MINUTE: ${RETENTION_JOB_MINUTE:-0}

      TZ: Asia/Ulaanbaatar
    depends_on:
      lms-db:
        condition: service_healthy
      lms-cache:
        condition: service_healthy
      lms-migrate:
        condition: service_completed_successfully
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # =========================================================================
  # lms-frontend — Nginx serving the built React SPA
  # =========================================================================
  lms-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    restart: unless-stopped
    depends_on:
      lms-api:
        condition: service_healthy
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      lms-api:
        condition: service_healthy
    networks:
      - lms_internal