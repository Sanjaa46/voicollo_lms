# =============================================================================
# purpose:  Alembic configuration for LMS schema migrations.
#           The actual DB URL is injected at runtime by alembic/env.py
#           from the DATABASE_URL environment variable — do NOT hardcode
#           credentials here.
# implements: LMS-SDD-002 §4 (Alembic — DB schema version control)
#             LMS-DB-003 §5 (Migration Strategy)
# =============================================================================

[alembic]
# Path to migration scripts directory
script_location = alembic

# Template for new migration file names.
# Format: <timestamp>_<slug>.py  e.g. 20250611_120000_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Prepend sys.path with this directory so app.* imports resolve correctly
# when running `alembic` from the project root.
prepend_sys_path = .

# Timezone for generated migration timestamps
timezone = UTC

# Maximum length of slug in file_template
truncate_slug_length = 40

# Do not modify this — version table name used by Alembic internally.
version_table = schema_migrations

# LMS-DB-003 §1: schema_migrations table is managed by Alembic.
# This aligns the Alembic version table name with the documented table name.

# Output encoding for generated migration files
output_encoding = utf-8

# -----------------------------------------------------------------------------
# DATABASE URL — intentionally left blank here.
# alembic/env.py reads DATABASE_URL from the environment at runtime.
# LMS-DB-003 §5: "Never apply DDL manually in production."
# LMS-SDD-002 §5.2: DATABASE_URL environment variable.
# -----------------------------------------------------------------------------
sqlalchemy.url =

# -----------------------------------------------------------------------------
# Logging configuration
# Controls Alembic's own log output during migrations.
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine
# Set to INFO to log all SQL statements during migration (useful for debugging).

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
