# =============================================================================
# purpose:  Single-node Docker Compose deployment for the LMS backend.
#           Four containers (LMS-SDD-002 §5.1):
#             lms-api     — FastAPI/Uvicorn application
#             lms-db      — MariaDB 10.6 persistent storage
#             lms-cache   — Redis 7 caching layer
#             lms-migrate — Alembic run-once migration container
#
# Usage:
#   cp .env.example .env && vi .env   # Fill in passwords and secrets
#   docker compose up -d              # Start all services
#   docker compose logs -f lms-api   # Follow API logs
#
# LMS-SDD-002 §5.1: Single-node deployment; no clustering at this scale.
# LMS-BRD-001 §7.2: Technology stack is fixed — FastAPI, Redis, MariaDB.
# =============================================================================

version: "3.9"

# ===========================================================================
# Named volumes — persist data across container restarts.
# ===========================================================================
volumes:
  lms_db_data:
    driver: local
    # LMS-BRD-001 §7.2: "All data must remain on-premises or within
    # approved government cloud infrastructure."
  lms_redis_data:
    driver: local

# ===========================================================================
# Internal network — all containers communicate privately.
# No container exposes DB or Redis ports externally.
# LMS-SDD-002 §5.1: "Never expose DB port externally."
# LMS-CACHE-005 §2: "bind: 127.0.0.1 or container network only. Never public."
# ===========================================================================
networks:
  lms_internal:
    driver: bridge

services:

  # =========================================================================
  # lms-db — MariaDB 10.6+
  # LMS-SDD-002 §5.1: internal port 3306, no external exposure.
  # LMS-DB-003 §1: InnoDB engine, utf8mb4 charset.
  # =========================================================================
  lms-db:
    image: mariadb:10.6
    container_name: lms-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: lms
      MARIADB_USER: ${LMS_APP_DB_USER:-lms_app}
      MARIADB_PASSWORD: ${LMS_APP_DB_PASSWORD:?LMS_APP_DB_PASSWORD is required}
      # Timezone — LMS-BRD-001 §7.1: Asia/Ulaanbaatar (UTC+8).
      # All timestamps stored as UTC DATETIME regardless of server TZ.
      TZ: Asia/Ulaanbaatar
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
      --max-connections=100
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow.log
      --long-query-time=1
    volumes:
      - lms_db_data:/var/lib/mysql
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No ports: block — DB must never be accessible externally.
    # LMS-SDD-002 §5.1: "Never expose DB port externally."

  # =========================================================================
  # lms-cache — Redis 7+
  # LMS-SDD-002 §5.1: internal port 6379, no external exposure.
  # LMS-CACHE-005 §2: requirepass, allkeys-lru, 256mb maxmemory.
  # =========================================================================
  lms-cache:
    image: redis:7-alpine
    container_name: lms-cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 3600 1
      --save 300 100
      --save 60 10000
      --loglevel notice
    environment:
      TZ: Asia/Ulaanbaatar
    volumes:
      - lms_redis_data:/data
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # No ports: block — Redis must never be accessible externally.
    # LMS-CACHE-005 §2: "Never public."

  # =========================================================================
  # lms-migrate — Alembic one-shot migration runner
  # Runs `alembic upgrade head` then exits (exit code 0).
  # LMS-DB-003 §5: "Run alembic upgrade head in the lms-migrate container
  # on every deployment."
  # =========================================================================
  lms-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      ROOT_DATABASE_URL: mysql+aiomysql://root:${DB_ROOT_PASSWORD}@lms-db:3306/lms
      # Migration runner needs a superuser URL to CREATE users and GRANT privileges.
      # Override DATABASE_URL here with a root connection for the migration container.
      # TODO: Use a dedicated migration user with GRANT OPTION in production.
      LMS_APP_DB_PASSWORD: ${LMS_APP_DB_PASSWORD}
      LMS_RETENTION_DB_PASSWORD: ${LMS_RETENTION_DB_PASSWORD:?LMS_RETENTION_DB_PASSWORD is required}
      TZ: Asia/Ulaanbaatar
    depends_on:
      lms-db:
        condition: service_healthy
    networks:
      - lms_internal
    restart: "no"  # Run once and exit — never restart.

  # =========================================================================
  # lms-api — FastAPI/Uvicorn application
  # LMS-SDD-002 §5.1: internal port 8000, exposed via reverse proxy.
  # LMS-SDD-002 §4: "use with --workers 2 for single-node production"
  # =========================================================================
  lms-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lms-api
    restart: unless-stopped
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --log-level info
      --access-log
    environment:
      # Application
      APP_ENV: ${APP_ENV:-production}
      APP_VERSION: ${APP_VERSION:-1.0.0}

      # Github OAuth
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:?GITHUB_REDIRECT_URI is required}

      # Database — LMS-SDD-002 §5.2
      DATABASE_URL: mysql+aiomysql://${LMS_APP_DB_USER:-lms_app}:${LMS_APP_DB_PASSWORD}@lms-db:3306/lms
      DB_HOST: lms-db
      RETENTION_DATABASE_URL: mysql+aiomysql://lms_retention:${LMS_RETENTION_DB_PASSWORD}@lms-db:3306/lms
      ALLOWED_GITHUB_USERNAME: ${ALLOWED_GITHUB_USERNAME:?ALLOWED_GITHUB_USERNAME is required}

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}

      # Redis — LMS-CACHE-005 §2
      REDIS_URL: redis://:${REDIS_PASSWORD}@lms-cache:6379/0

      # Cache TTLs — LMS-CACHE-005 §3
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-60}
      HEALTH_CACHE_TTL_SECONDS: ${HEALTH_CACHE_TTL_SECONDS:-10}

      # HMAC Signature secret
      INGEST_SIGNING_SECRET: ${INGEST_SIGNING_SECRET:?INGEST_SIGNING_SECRET is required}

      # Rate limiting — LMS-CACHE-005 §7
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}

      # Retention — LMS-BRD-001 FR-12, FR-13
      APP_LOG_RETENTION_DAYS: ${APP_LOG_RETENTION_DAYS:-90}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-365}
      RETENTION_JOB_HOUR: ${RETENTION_JOB_HOUR:-2}
      RETENTION_JOB_MINUTE: ${RETENTION_JOB_MINUTE:-0}

      TZ: Asia/Ulaanbaatar

    ports:
      # Expose 8000 — sit behind nginx reverse proxy in production.
      # LMS-SDD-002 §5.1: "Expose via reverse proxy in production."
      - "${LMS_API_PORT:-8000}:8000"
    depends_on:
      lms-db:
        condition: service_healthy
      lms-cache:
        condition: service_healthy
      lms-migrate:
        condition: service_completed_successfully
    networks:
      - lms_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
